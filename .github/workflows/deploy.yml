name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve site settings
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.SITE_URL }}" ]; then
            site="${{ vars.SITE_URL }}"
          else
            site="https://${owner}.github.io"
          fi
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            base="${{ vars.BASE_PATH }}"
          elif [ "$repo" = "${owner}.github.io" ]; then
            base=""
          else
            base="/${repo}"
          fi
          echo "SITE_URL=${site}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${base}" >> "$GITHUB_ENV"

      - name: Fetch shelves
        run: npm run data

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
